name: Daily Startup Leads Automation

on:
  schedule:
    - cron: '0 9 * * *' # Runs automatically every day at 9:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually anytime via GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pandas openpyxl

      - name: Run Scraper & Dispatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
